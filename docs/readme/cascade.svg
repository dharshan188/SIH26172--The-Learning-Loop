<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Two-stage cascade rejects look-alike words and accepts MARVIN">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060d1f"/><stop offset="1" stop-color="#120b2c"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.t{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
.v{opacity:0;animation:v 12s infinite}
@keyframes v{0%{opacity:0}4%{opacity:1}92%{opacity:1}100%{opacity:0}}
.row{animation:row 12s infinite}
</style></defs>
<rect width="1200" height="520" rx="20" fill="url(#bg)"/>
<g class="t">
<text x="40" y="48" font-size="24" font-weight="800" fill="#e2e8f0">Why two stages? Look-alike words never get through</text>
<text x="40" y="74" font-size="14.5" fill="#94a3b8">Stage-1 is tuned to never miss MARVIN; Stage-2 is an independent judge tuned to reject near-misses (illustrative scores)</text>
<text x="40" y="118" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">SPOKEN</text>
<text x="250" y="118" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2">STAGE-1 SENTINEL · τ 0.60</text>
<text x="640" y="118" font-size="13" font-weight="700" fill="#c084fc" letter-spacing="2">STAGE-2 JUDGE · τ 0.65</text>
<text x="1010" y="118" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">RESULT</text>

